<body>
<header>
<h1>🍓 FRUTINOVELA STUDIO</h1>
<p>Tu fábrica de historias virales con frutas</p>
</header>
<main>
<section class="card">
<h2>🎬 Crear nueva frutinovela</h2>
<label>Nombre de la historia</label>
<input id="story" placeholder="Ej: Amor, traición y venganza">
<label>Género de la historia</label>
<select id="genre">
<option>Amor y romance</option>
<option>Traición y venganza</option>
<option>Amor prohibido</option>
<option>Drama familiar</option>
<option>Comedia</option>
<option>Misterio</option>
</select>
<label>Personajes principales</label>
<input id="characters" value="Fresa, Manzana, Uva y Plátano">
<label>Número de capítulos</label>
<select id="chapters">
<option value="1">1 capítulo</option>
<option value="5">5 capítulos</option>
<option value="10" selected>10 capítulos</option>
</select>
<label>Duración del video</label>
<select id="duration">
<option value="60">60 segundos</option>
<option value="70" selected>70 segundos</option>
<option value="80">80 segundos</option>
</select>
<label>Descripción de la historia</label>
<textarea id="idea" placeholder="Describe brevemente lo que quieres que suceda..."></textarea>
<button class="primary" onclick="generate()">✨ GENERAR FRUTINOVELA</button>
<p class="small">Generador inicial gratuito. No requiere registro ni API.</p>
</section>

<section class="card result" id="result">
<h2>🎥 Tu frutinovela</h2>
<div id="output"></div>
<button class="primary" onclick="saveProject()">💾 GUARDAR PROYECTO</button>
<button class="secondary" style="width:100%;margin-top:9px" onclick="copyAll()">📋 COPIAR GUION COMPLETO</button>
</section>

<section class="card">
<h2>📚 Mis proyectos</h2>
<div id="saved"><p class="small">Todavía no tienes proyectos guardados.</p></div>
</section>
</main>
<footer>FRUTINOVELA STUDIO · Crea historias, despierta emociones 🍓</footer>

const safe=value=>String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const tone={
"Amor y romance":"emociones románticas, miradas expresivas y tensión sentimental",

"Comedia":"situaciones divertidas, reacciones exageradas y ritmo ligero",
"Misterio":"atmósfera intrigante, pistas visuales y suspenso"
};
const fruitProfiles = [
[/fresa|frutilla/i,"fruta roja con pequeñas semillas visibles y hojas verdes en la parte superior"],
[/manzana/i,"manzana redondeada roja o verde, con pequeño tallo y brillo natural"],
[/uva/i,"racimo compacto de uvas moradas o verdes, con hojas pequeñas"],
[/plátano|platano|banana/i,"plátano amarillo curvado con extremos naturales"],
[/naranja|mandarina/i,"cítrico naranja redondeado con textura fina de cáscara"],
[/limón|limon/i,"limón amarillo ovalado con textura fina de cáscara"],
[/piña|pina/i,"piña dorada con patrón geométrico y corona verde"],
[/pera/i,"pera verde o amarilla con silueta característica y pequeño tallo"],
[/mango/i,"mango ovalado con degradado natural amarillo y rojizo"],
[/sandía|sandia/i,"sandía verde con rayas oscuras y pulpa roja solo si la escena la muestra abierta"]
];
function visualIdentity(character){
const match=fruitProfiles.find(([pattern])=>pattern.test(character));
const fruit=match?match[1]:"fruta antropomórfica de diseño original; conservar exactamente el color, silueta y textura establecidos en su primera imagen";
return character+": "+fruit+"; personaje 3D antropomórfico; conservar el mismo rostro, ojos, cejas, boca, tamaño, proporciones, textura, vestuario y accesorios en todos los planos; no rediseñar ni cambiar de especie";
}
const cast=chars.map(character=>visualIdentity(character)).join("; ");
function emotionFor(beat,genre){
const title=String(beat[0]||"").toLowerCase();
const action=String(beat[1]||"").toLowerCase();
const dialogue=String(beat[2]||"").toLowerCase();
const text=title+" "+action+" "+dialogue;
const has=pattern=>pattern.test(text);
const make=(name,face,gesture,voice)=>({name,face,gesture,voice});
/* El diálogo tiene prioridad: evita que el género romántico convierta una sospecha en ternura. */
if(has(/\b(quien sabe|quién sabe|quien envio|quién envió|quien mando|quién mandó|me vigila|nos vigila|me observa|nos observa|que ocultas|qué ocultas|no confio|no confío|no te creo|no tiene sentido|alguien borro|alguien borró|mensaje desaparecio|mensaje desapareció|quien estuvo|quién estuvo|es sospechoso|nos estan siguiendo|nos están siguiendo)\b/)||/sospech|vigil|anonim|anónim|misterios|mensaje borrado|coartada|escucha/.test(text))
return make("sospecha y desconfianza","cejas ligeramente fruncidas, ojos entrecerrados y mirada que alterna entre el interlocutor y la pista; labios tensos, sin sonrisa romántica","inclina apenas la cabeza, retrocede medio paso o protege el objeto importante; observa antes de responder y mantiene las manos contenidas","voz baja, cautelosa y con pausas breves");
if(has(/\b(miedo|peligro|escapa|corran|huye|ayuda|nos descubrieron|no puedo|tengo miedo)\b/)||/huida|escape|persec|cuenta regresiva|amenaza/.test(text))
return make("miedo y urgencia","ojos abiertos, cejas elevadas y mirada que busca una salida; boca tensa y respiración visible","gira primero la cabeza hacia el peligro, desplaza el peso y da pasos rápidos pero estables; protege el cuerpo sin movimientos bruscos","voz urgente, respiración ligeramente agitada");
if(has(/\b(mentira|excusa|traidor|traicion|traición|culpable|enfrent|deten|basta|se acabaron|no voy a permitir|te equivocas)\b/)||/confront|acus|traici|trampa|careo|desafio|desafío|escandalo|escándalo/.test(text))
return make("enojo y determinación","cejas juntas, mirada firme y directa, mandíbula estable y labios tensos; evitar sonrisa","planta los pies, inclina el torso ligeramente hacia delante y usa un gesto claro de mano una sola vez para enfatizar","voz firme y controlada, con énfasis en las palabras clave");
if(has(/\b(te quiero|te amo|perdoname|perdóname|confio en ti|confío en ti|te extraño|te extrano|estoy contigo|juntos)\b/)||/reconcili|abrazo|amor correspondido|promesa romantica|promesa romántica/.test(text))
return make("ternura y afecto","mirada cálida sostenida, cejas relajadas y sonrisa pequeña y sincera","se acerca lentamente solo si la escena lo permite, relaja los hombros y ofrece una mano abierta sin invadir al otro personaje","voz suave, cálida y cercana");
if(has(/\b(jajaja|que divertido|qué divertido|increible|increíble|lo logramos|que alegria|qué alegría|genial|vamos a celebrar)\b/)||/comedia|fiesta|celebracion|celebración|broma/.test(text))
return make("alegría y entusiasmo","ojos vivaces, cejas elevadas y sonrisa natural; mejillas ligeramente levantadas","pequeño rebote corporal o movimiento abierto de brazos, seguido de una postura equilibrada; no agitarse sin motivo","voz animada y ligera");
if(has(/\b(lo siento|perdi|perdí|adios|adiós|no queria|no quería|me duele|te falle|te fallé|no volvera|no volverá)\b/)||/sacrificio|perdida|pérdida|despedida|duelo|recuerdo triste/.test(text))
return make("tristeza y vulnerabilidad","párpados algo bajos, cejas suavemente inclinadas y mirada que cae por un instante; sonrisa ausente","baja ligeramente los hombros, hace una pausa y acerca las manos al cuerpo; movimiento contenido y natural","voz suave, con emoción contenida");
if(has(/\b(que|qué)\s+(es|paso|pasó)|no puede ser|de verdad|encontramos|esta vivo|está vivo|la verdad|lo sabia|lo sabía\b/)||/revel|hallazgo|descubr|giro final|nombre oculto/.test(text))
return make("sorpresa y descubrimiento","ojos que se abren gradualmente, cejas elevadas y boca apenas entreabierta; después enfoca la mirada en la evidencia","se detiene un instante, mira el objeto o la persona revelada y luego vuelve la mirada al interlocutor","voz inicialmente contenida y después más clara");
if(genre==="Comedia")return make("alegría juguetona","sonrisa amplia pero natural, ojos vivaces y cejas móviles","gestos ágiles y expresivos, con equilibrio corporal y sin deformaciones","voz ligera y divertida");
return make("atención y cautela","rostro atento, cejas neutras y mirada enfocada en quien habla o en el objeto de la escena","movimientos pequeños de cabeza, manos y torso sincronizados con la acción; postura estable","voz natural y clara");
}
function cameraFor(beat,index,chapter,emotion){
const text=(beat[0]+" "+beat[1]).toLowerCase();
const n=(Number(chapter||1)*3+Number(index||0));
const choose=list=>list[n%list.length];
if(/huida|escape|persec|robo|corr[eé]n|salgan/.test(text))
return choose(["travelling lateral estable que acompaña la carrera y termina en plano medio","seguimiento desde atrás a velocidad moderada, sin perder los rostros","paneo controlado que revela la ruta de escape y vuelve al protagonista"]);
if(/confront|acus|traici|careo|desafio|desafío|discusion|discusión/.test(text))
return choose(["plano sobre el hombro del rival y acercamiento lento al personaje que habla","alternancia de primeros planos que muestra la reacción de ambos personajes","dolly-in corto al rostro, manteniendo al interlocutor desenfocado en primer término"]);
if(/carta|objeto|llave|mapa|fotografia|fotografía|prueba|documento|telefono|teléfono/.test(text))
return choose(["primerísimo plano de la pista y rack focus hacia los ojos del personaje","paneo lento siguiendo la mano hasta el objeto y elevación al rostro","plano detalle del objeto, seguido de un tilt-up suave al personaje"]);
if(/revel|giro|secreto|hallazgo|descubr|nombre/.test(text))
return choose(["acercamiento lento al rostro después de revelar la pista","cambio de foco desde la evidencia hasta la reacción del personaje","órbita corta y discreta que descubre la información detrás del personaje"]);
if(/repar|reconcili|nuevo comienzo|amanecer|abrazo/.test(text))
return choose(["órbita suave de un cuarto de vuelta y apertura gradual del encuadre","travelling de retroceso que deja ver a todos los personajes juntos","plano medio cálido con pequeño desplazamiento lateral"]);
return choose(["dolly-in lento desde plano medio hasta primer plano","travelling de seguimiento suave a la altura de los ojos","paneo corto que revela al segundo personaje","plano medio fijo con acercamiento muy sutil al final","desplazamiento diagonal lento que mantiene visible la acción"]);
}
function buildVideoPrompt(character,beat,seconds,chapter,sceneIndex,genre){
const emotion=emotionFor(beat,genre);
const camera=cameraFor(beat,sceneIndex,chapter,emotion);
const t1=Math.max(2,Math.round(seconds*0.22));
const t2=Math.max(t1+2,Math.round(seconds*0.72));
return "VIDEO 3D CINEMATOGRÁFICO VERTICAL 9:16. Duración: "+seconds+" segundos. Movimiento fluido a 24 fps. Escena: "+beat[0]+". PERSONAJES Y BLOQUEO VISUAL: "+cast+". Personaje que lleva la acción: "+character+". Usar el mismo modelo 3D y, si la herramienta lo permite, la misma imagen de referencia o el último fotograma del clip anterior. No cambiar color, especie, rostro, ojos, tamaño, proporciones, vestuario ni accesorios. ACCIÓN: "+beat[1]+". SECUENCIA: 0-"+t1+" s: establece el espacio y la mirada del personaje, con una respiración sutil y una preparación corporal legible; "+t1+"-"+t2+" s: ejecuta la acción principal con desplazamiento de peso, pasos apoyados y manos coordinadas; "+t2+"-"+seconds+" s: muestra la reacción emocional y termina en una pose estable que conecte con la escena siguiente. ACTUACIÓN EMOCIONAL: "+emotion.name+". ROSTRO: "+emotion.face+". GESTOS Y POSTURA: "+emotion.gesture+". VOZ: "+emotion.voice+". La emoción debe corresponder al significado del diálogo y de la acción; si el diálogo expresa sospecha, no mostrar ternura ni sonrisa romántica. CÁMARA: "+camera+". Variar el encuadre según la acción y evitar repetir el mismo movimiento de cámara en escenas consecutivas. Mantener al personaje principal enfocado y las manos visibles cuando sean necesarias. RITMO: inicio legible, acción central clara y cierre breve; sin aceleraciones artificiales. DIÁLOGO EN ESPAÑOL: "+character+" dice exactamente: «"+beat[2]+"». Sincronizar labios con esas palabras, respetar pausas naturales y no añadir ni cambiar diálogos. CONTINUIDAD: conservar lugar, iluminación, dirección de mirada, posición de objetos, vestuario y estado emocional; comenzar desde la pose final del clip anterior cuando sea posible y dejar una pose final útil para el siguiente. ESTILO: animación 3D de película familiar, iluminación cinematográfica suave, profundidad de campo moderada, expresiones claras y movimiento corporal natural. EVITAR: deformaciones, extremidades adicionales, cambios de rostro o vestuario, parpadeo visual, saltos de posición, movimientos robóticos, personajes duplicados, texto en pantalla, subtítulos, logos y marcas de agua.";
}
let html="";
let full="FRUTINOVELA: "+name+"\nGÉNERO: "+genre+"\nPERSONAJES: "+chars.join(", ")+"\nIDEA CENTRAL: "+idea+"\n\n";
for(let c=1;c<=chapters;c++){
const chapter=plans[c-1];
html+="<h3>📺 CAPÍTULO "+c+" — "+safe(["La señal","Las contradicciones","El precio de la verdad","Lo que ocultaba la familia","Frente a todos","Aliados por interés","La pieza desaparecida","Una decisión imposible","La última evidencia","Después de la verdad"][c-1])+"</h3>";
full+="CAPÍTULO "+c+"\n";
const base=Math.floor(duration/4),extra=duration%4;
chapter.forEach((beat,i)=>{
const character=chars[(c+i-1)%chars.length];
const seconds=base+(i<extra?1:0);
const action=beat[1]+" "+idea;
const dialogue=beat[2];
const prompt="Imagen cinematográfica 3D vertical 9:16. Ficha visual fija de los personajes: "+cast+". Protagonista de esta imagen: "+character+". Escena: "+beat[3]+". Acción congelada: "+action+". Tono: "+(tone[genre]||"drama cinematográfico")+". Expresiones legibles, composición dinámica, iluminación cuidada y fondo detallado. Mantener exactamente el mismo diseño visual en todas las escenas.";
const videoPrompt=buildVideoPrompt(character,beat,seconds,c,i,genre);
const title=beat[0];
html+='<div class="scene"><h3>'+safe(title)+' · '+seconds+' segundos</h3><p><b>Personaje:</b> '+safe(character)+'</p><p><b>Acción:</b> '+safe(action)+'</p><p><b>Diálogo:</b> '+safe(character)+': "'+safe(dialogue)+'"</p><p><b>Prompt de imagen:</b> '+safe(prompt)+'</p><button class="secondary" onclick="copyText('+JSON.stringify(prompt).replace(/</g,"\\u003c")+')">Copiar prompt de imagen</button><p><b>Prompt de video:</b> '+safe(videoPrompt)+'</p><button class="secondary" onclick="copyText('+JSON.stringify(videoPrompt).replace(/</g,"\\u003c")+')">Copiar prompt de video</button></div>';
full+=title+"\n"+action+"\n"+character+": "+dialogue+"\nPROMPT DE IMAGEN: "+prompt+"\nPROMPT DE VIDEO: "+videoPrompt+"\n\n";
});
}
currentText=full;
$("output").innerHTML=html;
$("result").style.display="block";
$("result").scrollIntoView({behavior:"smooth"});
}

function copyText(text){
if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>alert("¡Copiado!")).catch(()=>alert("No se pudo copiar."));}
else{alert("Selecciona y copia el texto manualmente.");}
}
function copyAll(){copyText(currentText);}
function saveProject(){
if(!currentText){alert("Primero genera una historia.");return;}
let projects=JSON.parse(localStorage.getItem("frutinovelaProjects")||"[]");
projects.unshift({date:new Date().toLocaleString(),text:currentText});
localStorage.setItem("frutinovelaProjects",JSON.stringify(projects));
loadProjects();
alert("¡Proyecto guardado!");
}
function loadProjects(){
let projects=JSON.parse(localStorage.getItem("frutinovelaProjects")||"[]");
$("saved").innerHTML=projects.length?projects.map((p,i)=>`<div class="scene"><b>Proyecto ${i+1}</b><p class="small">${p.date}</p><button class="secondary" onclick="copyText(${JSON.stringify(p.text)})">Copiar guion</button></div>`).join(""):'<p class="small">Todavía no tienes proyectos guardados.</p>';
}
loadProjects();
</script>
