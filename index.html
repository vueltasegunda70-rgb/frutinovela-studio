
<!DOCTYPE html>
<html lang="es">
<head>
 
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#702b80">
 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#24132f">
<title>Frutinovela Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100d18;color:#fff;font-family:Arial,sans-serif}
header{padding:25px 18px;background:linear-gradient(135deg,#702b80,#24132f);text-align:center}
header h1{margin:0;font-size:27px}
header p{color:#f3d9f5;font-size:13px}
main{max-width:720px;margin:auto;padding:16px}
.card{background:#211b2b;border:1px solid #40334e;border-radius:15px;padding:17px;margin-bottom:15px}
h2{font-size:18px;margin-top:0}
label{display:block;margin:13px 0 7px;font-size:13px;color:#e6d8ed}
input,select,textarea{width:100%;padding:13px;border-radius:9px;border:1px solid #594866;background:#17121e;color:white;font-size:15px}
textarea{min-height:75px;resize:vertical}
button{border:0;border-radius:10px;padding:13px;font-size:14px;font-weight:bold;cursor:pointer}
.primary{background:#e66bb7;color:#261329;width:100%;margin-top:16px}
.secondary{background:#44334f;color:white}
.result{display:none}
.scene{background:#17121e;padding:13px;border-radius:10px;margin:12px 0;border-left:3px solid #e66bb7}
.scene h3{margin:0 0 8px;color:#f4a4d4;font-size:15px}
.scene p{font-size:13px;line-height:1.5;color:#e4dce9}
.scene button{margin-top:7px}
.small{font-size:12px;color:#bcaec8}
footer{text-align:center;padding:20px;color:#a99bb5;font-size:12px}
</style>
</head>
<body>
<header>
<h1>🍓 FRUTINOVELA STUDIO</h1>
<p>Tu fábrica de historias virales con frutas</p>
</header>
<main>
<section class="card">
<h2>🎬 Crear nueva frutinovela</h2>
<label>Nombre de la historia</label>
<input id="story" placeholder="Ej: Amor, traición y venganza">
<label>Género de la historia</label>
<select id="genre">
<option>Amor y romance</option>
<option>Traición y venganza</option>
<option>Amor prohibido</option>
<option>Drama familiar</option>
<option>Comedia</option>
<option>Misterio</option>
</select>
<label>Personajes principales</label>
<input id="characters" value="Fresa, Manzana, Uva y Plátano">
<label>Número de capítulos</label>
<select id="chapters">
<option value="1">1 capítulo</option>
<option value="5">5 capítulos</option>
<option value="10" selected>10 capítulos</option>
</select>
<label>Duración del video</label>
<select id="duration">
<option value="60">60 segundos</option>
<option value="70" selected>70 segundos</option>
<option value="80">80 segundos</option>
</select>
<label>Descripción de la historia</label>
<textarea id="idea" placeholder="Describe brevemente lo que quieres que suceda..."></textarea>
<button class="primary" onclick="generate()">✨ GENERAR FRUTINOVELA</button>
<p class="small">Generador inicial gratuito. No requiere registro ni API.</p>
</section>

<section class="card result" id="result">
<h2>🎥 Tu frutinovela</h2>
<div id="output"></div>
<button class="primary" onclick="saveProject()">💾 GUARDAR PROYECTO</button>
<button class="secondary" style="width:100%;margin-top:9px" onclick="copyAll()">📋 COPIAR GUION COMPLETO</button>
</section>

<section class="card">
<h2>📚 Mis proyectos</h2>
<div id="saved"><p class="small">Todavía no tienes proyectos guardados.</p></div>
</section>
</main>
<footer>FRUTINOVELA STUDIO · Crea historias, despierta emociones 🍓</footer>

<script>
let currentText="";
const $=id=>document.getElementById(id);

function generate(){
const name=$("story").value.trim()||"El secreto de las frutas";
const genre=$("genre").value;
const chars=$("characters").value.split(",").map(x=>x.trim()).filter(Boolean);
const chapters=Number($("chapters").value);
const duration=Number($("duration").value);
const idea=$("idea").value.trim()||"Un secreto amenaza con separar a los protagonistas.";
if(chars.length===0){alert("Escribe al menos un personaje.");return;}

const plans=[
[
["LA INVITACIÓN INESPERADA","Una invitación anónima llega justo cuando todos se preparan para la fiesta del barrio.","¿Quién sabe tanto de mi vida como para enviarme esto?","sobre cerrado bajo la puerta"],
["EL LUGAR VACÍO","En la fiesta, una silla reservada permanece vacía y tiene el nombre de uno de los protagonistas.","Esa silla estaba preparada para alguien que no debía venir.","fiesta de frutas con silla reservada vacía"],
["LA PRIMERA PRUEBA","Dentro del sobre aparece una fotografía tomada esa misma mañana desde un lugar imposible.","Esta foto demuestra que alguien nos está vigilando.","fotografía misteriosa sobre una mesa"],
["UNA PROMESA PELIGROSA","El grupo decide guardar silencio hasta descubrir quién envió la invitación.","Si nos está observando, acaba de cometer un error.","grupo reunido haciendo un pacto secreto"]
],
[
["EL MENSAJE BORRADO","Un teléfono olvidado recibe una notificación y el mensaje desaparece antes de poder leerlo.","Alguien borró esto desde otro dispositivo.","teléfono iluminado con notificación misteriosa"],
["LA COARTADA","La persona señalada asegura que estuvo en casa, pero dos testigos cuentan versiones distintas.","No puedes estar en dos lugares al mismo tiempo.","discusión frente a dos testigos"],
["EL OBJETO PERDIDO","Aparece una llave escondida dentro de una caja que todos creían vacía.","Esta llave abre algo que llevamos años evitando.","llave antigua encontrada en caja"],
["EL TRATO","Para conseguir respuestas, una protagonista acepta reunirse a solas con quien envió la nota.","Iré, pero esta vez yo pondré las condiciones.","encuentro secreto en callejón iluminado"]
],
[
["LA REUNIÓN SECRETA","La cita comienza, pero una tercera persona escucha detrás de la puerta.","Sabía que vendrías; lo que no sabía era quién te seguía.","reunión clandestina con silueta escuchando"],
["EL CAMBIO DE BANDO","Un aliado entrega una información decisiva a la persona equivocada.","No lo hice por dinero; lo hice para proteger a alguien.","traición entre amigos en habitación dramática"],
["LA TRAMPA","El grupo prepara una falsa entrega para descubrir quién está filtrando sus planes.","Cuando aparezca, no lo enfrenten: graben todo.","preparación de una trampa con cámara escondida"],
["LA HUIDA","La trampa se activa antes de tiempo y todos deben escapar por caminos distintos.","¡Nos descubrieron! ¡Salgan por la puerta de atrás!","huida cinematográfica por pasillo"]
],
[
["LA CARTA ANTIGUA","Una carta guardada durante años revela que el conflicto comenzó mucho antes de lo que creían.","Esta letra es de alguien que juramos no volver a nombrar.","carta amarillenta abierta con cuidado"],
["EL RECUERDO","Un recuerdo de infancia cambia el significado de una promesa familiar.","Ahora entiendo por qué nunca hablaban de aquella noche.","recuerdo emotivo de infancia en tonos cálidos"],
["LA CONFESIÓN A MEDIAS","Un familiar admite haber ocultado la verdad, pero se niega a decir quién lo pidió.","Te conté una parte; la otra podría destruirnos.","confesión familiar en sala tenue"],
["EL NOMBRE","En el reverso de la carta aparece el nombre de la persona que todos daban por desaparecida.","Está vivo... y sabe que encontramos la carta.","nombre escrito detrás de carta"]
],
[
["EL ESCÁNDALO PÚBLICO","Un rumor se difunde durante un evento y deja a una protagonista frente a todos.","No voy a esconderme por una mentira que ustedes inventaron.","evento público con miradas sorprendidas"],
["EL DESAFÍO","Para limpiar su nombre, exige que presenten la prueba delante de todos.","Si tienen pruebas, este es el momento de mostrarlas.","protagonista enfrentando a un grupo"],
["LA PRUEBA ALTERADA","El video que debía demostrar la verdad aparece editado y contradice los hechos.","Ese video no está completo; alguien cortó la parte importante.","pantalla mostrando video interrumpido"],
["EL TESTIGO","Una persona del público se ofrece a declarar, pero pide protección.","Yo vi quién entró primero. Y puedo demostrarlo.","testigo levantando la mano entre la multitud"]
],
[
["LA ALIANZA FALSA","Dos rivales acuerdan cooperar, aunque cada uno prepara un plan secreto.","Trabajaremos juntos, pero no confundas eso con confianza.","dos rivales estrechando la mano con tensión"],
["EL MAPA","Una pista conduce a un almacén y marca una hora exacta para encontrar el siguiente objeto.","Tenemos una sola oportunidad antes de que lo retiren.","mapa con ubicación marcada sobre mesa"],
["LA ESCUCHA","Una conversación captada por accidente revela que el objeto ya fue trasladado.","No vamos al almacén. Nos están esperando allí.","personaje escuchando audio en auriculares"],
["EL GIRO","La persona que parecía estar ayudando aparece en la grabación dando instrucciones al enemigo.","La voz es suya. Nos ha estado guiando hacia una trampa.","grabación revelando a un traidor"]
],
[
["LA BÚSQUEDA","El grupo sigue una pista hasta un lugar abandonado donde alguien dejó señales recientes.","No está abandonado; alguien estuvo aquí hace minutos.","búsqueda en edificio abandonado"],
["EL HALLAZGO","Detrás de una pared falsa encuentran el objeto que faltaba desde el primer capítulo.","Esto conecta la fotografía, la llave y la carta.","objeto oculto tras pared secreta"],
["LA ACUSACIÓN","Dos personajes se enfrentan porque cada uno interpreta la evidencia de forma diferente.","Deja de protegerlo. La prueba está delante de nosotros.","discusión intensa junto a evidencia"],
["EL ROBO","Antes de poder salir, una mano desconocida arrebata la prueba y desaparece.","¡Cierren las salidas! ¡No puede escapar!","mano misteriosa robando evidencia"]
],
[
["LA DECISIÓN","Una protagonista puede recuperar la prueba o ayudar a un aliado herido, pero no ambas cosas.","No voy a abandonar a nadie para ganar esta pelea.","decisión difícil en escena dramática"],
["EL SACRIFICIO","El aliado entrega una copia escondida y confiesa que la preparó por si algo salía mal.","Si me pasa algo, entrega esto a todos.","entrega secreta de memoria USB"],
["LA VERDAD COMPLETA","La copia revela quién organizó los engaños y cuál era el verdadero objetivo.","No querían separarnos; querían que encontráramos esto.","revelación frente a pantalla con documentos"],
["LA VISITA","Cuando creen que todo terminó, alguien llama a la puerta y pronuncia una frase conocida.","Vengo a contarles lo que falta.","figura inesperada en la entrada de casa"]
],
[
["LA ÚLTIMA PIEZA","La visita entrega una prueba original que permite reconstruir los hechos sin dudas.","Con esto ya no pueden cambiar la historia.","documento original bajo luz intensa"],
["EL CAREO","Los protagonistas reúnen a todos los implicados y exigen respuestas cara a cara.","Hoy nadie se va sin decir la verdad.","careo de personajes en una sala"],
["LA CUENTA REGRESIVA","El responsable intenta destruir la última evidencia y el grupo tiene segundos para detenerlo.","¡Deténlo! Si quema eso, perdemos la única copia.","cuenta regresiva y evidencia en peligro"],
["EL GIRO FINAL","La prueba se salva, pero revela que el plan tenía un segundo responsable.","Encontramos al primero... pero alguien más dio la orden.","rostro sorprendido ante nueva evidencia"]
],
[
["LA CONFRONTACIÓN","Los protagonistas enfrentan al responsable y reconstruyen cada mentira delante de todos.","Se acabaron tus excusas. Esta vez tenemos toda la verdad.","confrontación final cinematográfica"],
["LA REPARACIÓN","Cada personaje decide qué hará para reparar el daño que causó o sufrió.","No puedo cambiar lo que hice, pero sí lo que haré ahora.","reconciliación emotiva entre personajes"],
["EL NUEVO COMIENZO","El grupo recupera la confianza y abre una nueva etapa sin ocultar lo ocurrido.","Desde hoy, ninguna decisión se tomará a escondidas.","grupo unido al amanecer"],
["EL SECRETO QUE QUEDA","Una última llamada revela que alguien conservó una copia de la primera fotografía.","Creyeron que todo terminó... pero yo guardé el original.","teléfono sonando con fotografía misteriosa"]
]
];
const safe=value=>String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const tone={
"Amor y romance":"emociones románticas, miradas expresivas y tensión sentimental",
"Traición y venganza":"suspenso, desconfianza y tensión dramática",
"Amor prohibido":"romance secreto, tensión emocional y decisiones difíciles",
"Drama familiar":"conflictos familiares, secretos y emociones intensas",
"Comedia":"situaciones divertidas, reacciones exageradas y ritmo ligero",
"Misterio":"atmósfera intrigante, pistas visuales y suspenso"
};
const fruitProfiles = [
[/fresa|frutilla/i,"fruta roja con pequeñas semillas visibles y hojas verdes en la parte superior"],
[/manzana/i,"manzana redondeada roja o verde, con pequeño tallo y brillo natural"],
[/uva/i,"racimo compacto de uvas moradas o verdes, con hojas pequeñas"],
[/plátano|platano|banana/i,"plátano amarillo curvado con extremos naturales"],
[/naranja|mandarina/i,"cítrico naranja redondeado con textura fina de cáscara"],
[/limón|limon/i,"limón amarillo ovalado con textura fina de cáscara"],
[/piña|pina/i,"piña dorada con patrón geométrico y corona verde"],
[/pera/i,"pera verde o amarilla con silueta característica y pequeño tallo"],
[/mango/i,"mango ovalado con degradado natural amarillo y rojizo"],
[/sandía|sandia/i,"sandía verde con rayas oscuras y pulpa roja solo si la escena la muestra abierta"]
];
function visualIdentity(character){
const match=fruitProfiles.find(([pattern])=>pattern.test(character));
const fruit=match?match[1]:"fruta antropomórfica de diseño original; conservar exactamente el color, silueta y textura establecidos en su primera imagen";
return character+": "+fruit+"; personaje 3D antropomórfico; conservar el mismo rostro, ojos, cejas, boca, tamaño, proporciones, textura, vestuario y accesorios en todos los planos; no rediseñar ni cambiar de especie";
}
const cast=chars.map(character=>visualIdentity(character)).join("; ");
function emotionFor(beat,genre){
const text=(beat[0]+" "+beat[1]).toLowerCase();
if(/confront|acus|traici|mentir|enga|trampa|careo|desafío|desafio/.test(text))return {name:"tensión y determinación",face:"cejas ligeramente juntas, mirada fija, ojos atentos y mandíbula firme",gesture:"inclina el torso hacia delante, señala o abre las manos solo cuando corresponda y mantiene los pies firmes"};
if(/huida|escape|persec|robo|cuenta regresiva/.test(text))return {name:"urgencia y miedo controlado",face:"ojos abiertos, cejas elevadas y mirada que sigue el peligro",gesture:"pasos rápidos pero apoyados, brazos equilibrando el cuerpo y giro de cabeza hacia la dirección de escape"};
if(/confes|recuerdo|carta|promesa|sacrificio|sacrificio|reparación|reconciliación/.test(text))return {name:"emoción vulnerable",face:"mirada suave, cejas expresivas y sonrisa o tristeza contenida según el diálogo",gesture:"respiración visible y sutil, hombros relajados y manos que se acercan al pecho o al objeto importante"};
if(/revel|hallazgo|prueba|secreto|giro|nombre|descubr/.test(text))return {name:"sorpresa y descubrimiento",face:"ojos que se abren gradualmente, cejas elevadas y boca ligeramente entreabierta",gesture:"detiene brevemente el movimiento, dirige la mirada al descubrimiento y después reacciona con un gesto claro"};
if(genre==="Comedia")return {name:"alegría juguetona",face:"sonrisa amplia, ojos vivaces y cejas móviles",gesture:"movimientos ágiles y expresivos, sin exagerar ni deformar el cuerpo"};
if(/Amor|romance/i.test(genre))return {name:"ternura y nerviosismo",face:"mirada cálida, sonrisa discreta y cejas suaves",gesture:"pequeño acercamiento, mirada al otro personaje y manos relajadas"};
return {name:"emoción coherente con el diálogo",face:"expresión facial legible y natural que cambia gradualmente",gesture:"gestos pequeños de manos, cabeza y torso sincronizados con la acción"};
}
function cameraFor(beat,index){
const text=(beat[0]+" "+beat[1]).toLowerCase();
if(/huida|escape|persec|robo/.test(text))return "travelling lateral fluido que acompaña al personaje, cámara estable y sin vibraciones bruscas";
if(/confront|acus|traici|careo|desafío|desafio/.test(text))return "plano medio sobre el hombro y acercamiento lento hacia el personaje que habla, manteniendo visible su reacción";
if(/carta|objeto|llave|mapa|fotografía|fotografia|prueba|documento/.test(text))return "primer plano del objeto importante y elevación suave de cámara hasta revelar el rostro del personaje";
if(/revel|giro|secreto|hallazgo|descubr/.test(text))return "acercamiento cinematográfico lento con cambio de foco desde la pista hasta los ojos del personaje";
if(/repar|reconcili|nuevo comienzo|amanecer/.test(text))return "órbita muy suave alrededor de los personajes y apertura gradual del encuadre";
return ["dolly-in lento desde plano medio hasta primer plano","travelling de seguimiento suave a la altura de los ojos","paneo corto y controlado que revela al otro personaje"][index%3];
}
function buildVideoPrompt(character,beat,seconds,chapter,sceneIndex,genre){
const emotion=emotionFor(beat,genre);
const camera=cameraFor(beat,sceneIndex);
const t1=Math.max(2,Math.round(seconds*0.22));
const t2=Math.max(t1+2,Math.round(seconds*0.72));
return "VIDEO 3D CINEMATOGRÁFICO VERTICAL 9:16. Duración: "+seconds+" segundos. Movimiento fluido a 24 fps. Escena: "+beat[0]+". PERSONAJES Y BLOQUEO VISUAL: "+cast+". Personaje que lleva la acción: "+character+". Usar el mismo modelo 3D y, si la herramienta lo permite, la misma imagen de referencia o el último fotograma del clip anterior. No cambiar color, especie, rostro, ojos, tamaño, proporciones, vestuario ni accesorios. ACCIÓN: "+beat[1]+". SECUENCIA: 0-"+t1+" s: el personaje orienta la mirada hacia el elemento o persona relevante y prepara la acción con una respiración sutil; "+t1+"-"+t2+" s: realiza de forma clara y completa la acción descrita, con desplazamiento del peso, pasos y movimiento de brazos físicamente naturales; "+t2+"-"+seconds+" s: muestra la consecuencia emocional, dirige la mirada al interlocutor u objeto y termina en una pose estable que permita enlazar con la escena siguiente. EMOCIÓN: "+emotion.name+". ROSTRO: "+emotion.face+". GESTOS: "+emotion.gesture+". CÁMARA: "+camera+". Mantener al personaje principal enfocado y las manos visibles cuando sean necesarias. RITMO: inicio legible, acción central con energía y cierre breve; sin movimientos acelerados artificiales. DIÁLOGO EN ESPAÑOL: "+character+" dice exactamente: «"+beat[2]+"». Sincronizar labios con esas palabras y no añadir diálogos. CONTINUIDAD: conservar lugar, iluminación, dirección de mirada, posición de objetos y estado de los personajes; conectar con el final del capítulo anterior y dejar una pose final útil para el siguiente. ESTILO: animación 3D de película familiar, iluminación cinematográfica suave, profundidad de campo moderada, expresiones claras y movimiento corporal natural. EVITAR: deformaciones, extremidades adicionales, cambios de rostro o vestuario, parpadeo, saltos de posición, movimientos robóticos, personajes duplicados, texto en pantalla, subtítulos, logos y marcas de agua.";
}
let html="";
let full="FRUTINOVELA: "+name+"\nGÉNERO: "+genre+"\nPERSONAJES: "+chars.join(", ")+"\nIDEA CENTRAL: "+idea+"\n\n";
for(let c=1;c<=chapters;c++){
const chapter=plans[c-1];
html+="<h3>📺 CAPÍTULO "+c+" — "+safe(["La señal","Las contradicciones","El precio de la verdad","Lo que ocultaba la familia","Frente a todos","Aliados por interés","La pieza desaparecida","Una decisión imposible","La última evidencia","Después de la verdad"][c-1])+"</h3>";
full+="CAPÍTULO "+c+"\n";
const base=Math.floor(duration/4),extra=duration%4;
chapter.forEach((beat,i)=>{
const character=chars[(c+i-1)%chars.length];
const seconds=base+(i<extra?1:0);
const action=beat[1]+" "+idea;
const dialogue=beat[2];
const prompt="Imagen cinematográfica 3D vertical 9:16. Ficha visual fija de los personajes: "+cast+". Protagonista de esta imagen: "+character+". Escena: "+beat[3]+". Acción congelada: "+action+". Tono: "+(tone[genre]||"drama cinematográfico")+". Expresiones legibles, composición dinámica, iluminación cuidada y fondo detallado. Mantener exactamente el mismo diseño visual en todas las escenas.";
const videoPrompt=buildVideoPrompt(character,beat,seconds,c,i,genre);
const title=beat[0];
html+='<div class="scene"><h3>'+safe(title)+' · '+seconds+' segundos</h3><p><b>Personaje:</b> '+safe(character)+'</p><p><b>Acción:</b> '+safe(action)+'</p><p><b>Diálogo:</b> '+safe(character)+': "'+safe(dialogue)+'"</p><p><b>Prompt de imagen:</b> '+safe(prompt)+'</p><button class="secondary" onclick="copyText('+JSON.stringify(prompt).replace(/</g,"\\u003c")+')">Copiar prompt de imagen</button><p><b>Prompt de video:</b> '+safe(videoPrompt)+'</p><button class="secondary" onclick="copyText('+JSON.stringify(videoPrompt).replace(/</g,"\\u003c")+')">Copiar prompt de video</button></div>';
full+=title+"\n"+action+"\n"+character+": "+dialogue+"\nPROMPT DE IMAGEN: "+prompt+"\nPROMPT DE VIDEO: "+videoPrompt+"\n\n";
});
}
currentText=full;
$("output").innerHTML=html;
$("result").style.display="block";
$("result").scrollIntoView({behavior:"smooth"});
}

function copyText(text){
if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>alert("¡Copiado!")).catch(()=>alert("No se pudo copiar."));}
else{alert("Selecciona y copia el texto manualmente.");}
}
function copyAll(){copyText(currentText);}
function saveProject(){
if(!currentText){alert("Primero genera una historia.");return;}
let projects=JSON.parse(localStorage.getItem("frutinovelaProjects")||"[]");
projects.unshift({date:new Date().toLocaleString(),text:currentText});
localStorage.setItem("frutinovelaProjects",JSON.stringify(projects));
loadProjects();
alert("¡Proyecto guardado!");
}
function loadProjects(){
let projects=JSON.parse(localStorage.getItem("frutinovelaProjects")||"[]");
$("saved").innerHTML=projects.length?projects.map((p,i)=>`<div class="scene"><b>Proyecto ${i+1}</b><p class="small">${p.date}</p><button class="secondary" onclick="copyText(${JSON.stringify(p.text)})">Copiar guion</button></div>`).join(""):'<p class="small">Todavía no tienes proyectos guardados.</p>';
}
loadProjects();
</script>

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("Frutinovela Studio lista"))
      .catch(error => console.error("Error:", error));
  });
}
 </script>
